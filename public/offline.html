<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaiwa — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #faf9f7; color: #1c1917; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: #78716c; margin: 4px 0; }
    button { margin-top: 20px; background: #c41e3a; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>オフラインです</h1>
    <p>Bạn đang offline. Hội thoại với AI cần có kết nối mạng.</p>
    <p>You're offline. AI conversations need an internet connection.</p>
    <button onclick="location.reload()">Thử lại / Retry</button>
  </main>
</body>
</html>
