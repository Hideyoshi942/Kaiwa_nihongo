services:
  postgres:
    image: postgres:16-alpine
    container_name: kaiwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaiwa
      POSTGRES_PASSWORD: kaiwa_secret
      POSTGRES_DB: kaiwa_nihongo
    ports:
      - "5432:5432"
    volumes:
      - kaiwa_pg_data:/var/lib/postgresql/data

volumes:
  kaiwa_pg_data:
